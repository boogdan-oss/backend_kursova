name: cryptoparser

x-backend: &backend
  image: cryptoparser-backend
  restart: unless-stopped
  env_file: .env
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"
  environment:
    DB_HOST: postgres
    DB_PORT: 5432
    DB_USER: ${POSTGRES_USER:?}
    DB_PASSWORD: ${POSTGRES_PASSWORD:?}
    DB_NAME: ${POSTGRES_DB:?}
    REDIS_HOST: redis
    REDIS_PORT: 6379
    REDIS_PASSWORD: ${REDIS_PASSWORD:?}
  networks:
    - infra

services:
  api:
    <<: *backend
    build:
      context: .
      target: base
    ports:
      - "8000:8000"

  collector:
    <<: *backend
    command: python -m app.workers.collector

networks:
  infra:
    external: true
    name: crypto-infra_default
