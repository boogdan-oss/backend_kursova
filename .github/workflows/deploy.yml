name: Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy-oracle
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # .env у CI немає, а без адрес налаштування не завантажаться. Ці адреси навмисно неробочі:
    # звичайні тести не мають торкатись БД і Redis. Справжня БД — лише для інтеграційних тестів
    env:
      DATABASE_URL: postgresql+asyncpg://ci:ci@127.0.0.1:1/ci
      REDIS_URL: redis://127.0.0.1:1/0
      CI_DATABASE_URL: postgresql+asyncpg://ci:ci@127.0.0.1:5432/ci_test
    services:
      db:
        image: timescale/timescaledb:latest-pg16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ci_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy app
      - name: Міграції на чистій БД
        run: DATABASE_URL="$CI_DATABASE_URL" alembic upgrade head
      - name: Тести (разом з інтеграційними на справжній БД)
        run: TEST_DATABASE_URL="$CI_DATABASE_URL" pytest -q
      - name: Зібрати образ
        run: docker build --target base -t cryptoparser-backend:ci .

  deploy:
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SSH_TARGET: ${{ secrets.ORACLE_USER }}@${{ secrets.ORACLE_HOST }}
    steps:
      - uses: actions/checkout@v4

      - name: Перевірити секрети
        env:
          ORACLE_USER: ${{ secrets.ORACLE_USER }}
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
          ORACLE_KNOWN_HOSTS: ${{ secrets.ORACLE_KNOWN_HOSTS }}
        run: |
          missing=""
          for name in ORACLE_USER ORACLE_HOST ORACLE_SSH_KEY ORACLE_KNOWN_HOSTS; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Не задані секрети:$missing (Settings → Secrets and variables → Actions → Repository secrets)"
            exit 1
          fi

      - name: Налаштувати SSH
        env:
          SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.ORACLE_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          # Ключ, скопійований у Windows, може мати CRLF — ssh такий не прочитає
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Передати код на сервер
        run: |
          git archive --format=tar.gz HEAD | ssh -i ~/.ssh/id_deploy "$SSH_TARGET" '
            set -e
            free_kb=$(df --output=avail -k / | tail -1)
            if [ "$free_kb" -lt 2097152 ]; then
              echo "На сервері менше 2 ГБ вільного місця — деплой зупинено" >&2
              df -h / >&2
              docker system df >&2 || true
              exit 1
            fi
            mkdir -p ~/cryptoparser
            cd ~/cryptoparser
            rm -rf app alembic tests
            tar -xzf -
          '

      - name: Зібрати, застосувати міграції, запустити
        run: |
          ssh -i ~/.ssh/id_deploy "$SSH_TARGET" bash -s <<'REMOTE'
          set -euo pipefail
          cd ~/cryptoparser

          if [ ! -f .env ]; then
            echo "Немає ~/cryptoparser/.env — створи його з .env.prod.example" >&2
            exit 1
          fi

          compose="docker compose -f docker-compose.prod.yml"

          $compose build api
          # </dev/null: скрипт читається зі stdin, і docker compose з'їв би його решту
          $compose run --rm -T api alembic upgrade head </dev/null
          $compose up -d api collector

          for _ in $(seq 1 30); do
            if $compose exec -T api python -c "
          import json, urllib.request
          body = json.load(urllib.request.urlopen('http://localhost:8000/api/v1/health', timeout=5))
          raise SystemExit(body['status'] != 'ok')
          " </dev/null 2>/dev/null; then
              echo "API працює"
              docker image prune -f
              docker builder prune -f --filter until=72h
              df -h /
              exit 0
            fi
            sleep 2
          done

          echo "API не пройшов перевірку /health" >&2
          $compose logs --tail=50 api >&2
          exit 1
          REMOTE
